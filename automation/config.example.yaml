# Copy to automation/config.yaml and fill in non-secret values.
# Secrets live in .env (see .env.example).

jira:
  project_key: SDLC
  epic_link_field: customfield_10014
  statuses_open:
    - To Do
    - In Progress
    - Blocked

github:
  # Repositories watched for CVEs and library changes
  repositories:
    - owner: your-org
      name: your-repo
      default_branch: main

email:
  subject_prefix: "[SDLC]"
  timezone: Europe/Madrid
  digest_hour_local: 8

cve:
  digest_severities:
    - CRITICAL
    - HIGH
    - MEDIUM
  sources:
    - github_advisories
    - manual
  auto_jira_on_critical: true
  # SLA targets (hours) before a pending CVE is flagged
  sla_hours:
    CRITICAL: 48
    HIGH: 168
    MEDIUM: 720
    LOW: 2160
  release_gate:
    enabled: true
    block_severities:
      - CRITICAL
      - HIGH
  policy:
    require_four_eyes: true
    four_eyes_severities:
      - CRITICAL
    restricted_discard_severities:
      - CRITICAL
    # Emails/usernames allowed to approve CRITICAL discard/accept
    approvers:
      - you@example.com

libraries:
  ecosystems:
    - npm
    - pip
    - go
    - maven
  notify_on:
    - version_bump
    - new_dependency
    - removed_dependency
